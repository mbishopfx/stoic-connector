    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the real event and MCP-call sources, managed Agents API history boundaries, and the safest six-hour/monthly analytics design for the requested owner dashboard."
    inputs:
      - "src/lib/managed-codex.ts"
      - "src/app/api/mcp/route.ts"
      - "src/lib/account.ts"
      - "src/lib/coordination.ts"
      - "src/lib/board.ts"
      - "src/lib/ideas.ts"
      - "supabase/migrations"
      - "src/app/api/cron"
      - "design/"
    constraints:
      - "Read-only; do not edit product or board files."
      - "Do not run tests or make provider requests."
      - "Distinguish activity stored by Stoic from activity only visible to a user's Codex or third-party agent runtime."
      - "Use concrete source paths and current official API documentation."
    expected_output:
      - "Existing event sources and gaps for each requested metric."
      - "Managed Agents API session listing/history semantics and fit for this request."
      - "A bounded data/retention/aggregation design, including workspace isolation."
      - "Candidate implementation slices, exact files, verification commands, and stop conditions."
