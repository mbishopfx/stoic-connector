# GoalBuddy v2 state: PM-owned board truth.
version: 2

goal:
  title: "Stoic Platform Dashboard Redesign"
  slug: "stoic-platform-dashboard"
  kind: specific
  tranche: "Implement and audit the owner dashboard redesign, ideas assignment workflow, and real six-hour/monthly agent activity analytics."
  status: done
  intake:
    original_request: "Use the dashboard preset, keep current tabs, add six-hour agent-to-agent/action/MCP stats compounded over a month, and make Ideas a table with a popup to assign or deny."
    interpreted_outcome: "A preset-based owner dashboard keeps the current 12 tabs, provides real agent activity analytics in Overview, and supports assigning or denying ideas from a table dialog."
    input_shape: specific
    audience: "Stoic workspace owners"
    authority: requested
    proof_type: artifact
    completion_proof: "Dashboard, metrics capture/aggregation, and ideas assignment flow are implemented with truthful source boundaries and pass the selected source/build checks; final audit maps evidence to all requested behavior."
    likely_misfire: "Mock metrics or an implication that the managed Agents API can inspect unrelated Codex Desktop or third-party conversations."
    blind_spots_considered:
      - "Dashboard surface choice is unanswered; proceed with the recommended owner web dashboard at /dashboard unless the user steers otherwise."
      - "Historical MCP calls are not currently captured; exact MCP counts start after instrumentation."
      - "Use consistent UTC six-hour windows and daily 30-day chart buckets."
      - "Idea assignment must honor workspace policy and connected-worker eligibility."
    existing_plan_facts:
      - "design/main-redesign.md specifies dashboard-01 as the main layout and preset b4aRK5K0fb for active-window components."
      - "Keep the current 12 navigation tabs and place collaboration stats in an existing tab."
      - "Use design/ideas.md, design/charts.md, and design/graphs.md for the Ideas table and charts."
      - "Ideas rows open a popup for assignment to an agent or denial."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/stoic-platform-dashboard"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

